name: Apply admin role guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    if: ${{ !contains(github.event.head_commit.message, '[role-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide normal Settings from Super Admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.tsx')
          s = p.read_text()
          old = "const NAV=[['Overview',Home],['Attendance',CalendarDays],['Members',Users],['PINs',ShieldCheck],['Reports',Download],['Settings',Settings]] as const"
          new = "const NAV=[['Overview',Home],['Attendance',CalendarDays],['Members',Users],['PINs',ShieldCheck],['Reports',Download],['Settings',Settings]] as const\nconst SUPER_ADMIN_EMAIL='orierodavid@gmail.com'"
          if old not in s:
              raise SystemExit('NAV anchor not found')
          s = s.replace(old, new, 1)
          old2 = " return <main className=\"h-app\"><aside className={`h-sidebar ${mobile?'open':''}`}><div className=\"h-side-brand\">"
          new2 = " const isSuperAdmin=email.trim().toLowerCase()===SUPER_ADMIN_EMAIL\n return <main className=\"h-app\"><aside className={`h-sidebar ${mobile?'open':''}`}><div className=\"h-side-brand\">"
          if old2 not in s:
              raise SystemExit('render anchor not found')
          s = s.replace(old2, new2, 1)
          old3 = "{NAV.map(([id,Icon])=><button key={id}"
          new3 = "{NAV.filter(([id])=>!isSuperAdmin||id!=='Settings').map(([id,Icon])=><button key={id}"
          if old3 not in s:
              raise SystemExit('nav render anchor not found')
          s = s.replace(old3, new3, 1)
          old4 = "onClick={()=>setTab('Settings')}>Manage service"
          new4 = "onClick={()=>setTab(isSuperAdmin?'Overview':'Settings')}>Manage service"
          if old4 in s:
              s = s.replace(old4, new4, 1)
          old5 = "onClick={()=>setTab('Settings')}><span className=\"h-action-icon purple\"><Settings size={16}/></span><div><b>Service settings</b>"
          new5 = "onClick={()=>setTab(isSuperAdmin?'Overview':'Settings')}><span className=\"h-action-icon purple\"><Settings size={16}/></span><div><b>{isSuperAdmin?'System controls':'Service settings'}</b>"
          if old5 in s:
              s = s.replace(old5, new5, 1)
          p.write_text(s)
          PY

      - name: Commit role guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Hide normal Settings from Super Admin [role-guard]"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/role-guard.yml
          git commit -m "Remove temporary role guard workflow [role-guard]"
          git push
